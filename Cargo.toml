[package]
name = "framefault"
version = "0.2.0"
edition = "2021"
description = "One crash verdict per incident — read-only, no-admin Windows app and game crash diagnostics"
license = "MIT"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts", "links", "clipboard"] }
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_System_Registry",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_EventLog",
  "Win32_System_SystemInformation",
  "Win32_Storage_FileSystem",
  "Win32_Graphics_Dxgi",
] }
serde = { version = "1", features = ["derive"] }
toml = "1"
quick-xml = "0.42"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
walkdir = "2"
dirs = "7"
notify = "9"
minidump = "0.27"
clap = { version = "4", optional = true, features = ["derive"] }

[features]
default = []
cli = ["dep:clap"]
# .evtx fallback is implemented by shelling out to wevtutil; no crate needed.
evtx = []

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"
