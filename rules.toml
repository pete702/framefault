version = 1
window_sec = 15

# ---------------------------------------------------------------------------
# GPU driver resets (TDR). NVIDIA / AMD / Intel all land in different providers.
# ---------------------------------------------------------------------------

[[rules]]
id = "tdr_nvidia_153"
source = "eventlog"
channel = "System"
provider = "nvlddmkm"
event_id = 153
match_field = "detail"
match_contains = "GPUID"
weight = 40
verdict = "NVIDIA GPU driver timeout (TDR) - the game did not crash on its own"
confidence = "High"
next_steps = ["Remove GPU and memory overclock/undervolt", "Check the driver version", "Try disabling MPO"]
link = "https://learn.microsoft.com/en-us/answers/questions/4307117/game-crash-with-the-description-for-event-id-0-fro"

[[rules]]
id = "tdr_amd_153"
source = "eventlog"
channel = "System"
provider_any = ["amdkmdag", "amdwddmg", "amdkmdap"]
event_id = 153
weight = 40
verdict = "AMD GPU driver timeout (TDR) - the game did not crash on its own"
confidence = "High"
next_steps = ["Disable overclock/undervolt", "Try WhisperMode or the Adrenalin stability profile", "Check MPO"]
link = "https://learn.microsoft.com/en-us/answers/questions/4174161/event-id-4101-display-driver-amdwddmg-stopped-resp"

[[rules]]
id = "tdr_intel_153"
source = "eventlog"
channel = "System"
provider_any = ["igfxn", "igdkmdn64", "igdkmd64", "igfx", "igdlh64"]
event_id = 153
weight = 40
verdict = "Intel graphics driver timeout (TDR)"
confidence = "High"
next_steps = ["Check the Intel driver", "Disable MPO", "Check power and temperatures"]
link = "https://learn.microsoft.com/en-us/answers/questions/2319492/surface-laptop-3-event-4101-display-driver-igfxn-s"

[[rules]]
id = "display_4101"
source = "eventlog"
channel = "System"
provider = "Display"
event_id = 4101
weight = 15
verdict = "Display driver stopped responding and recovered (TDR)"
confidence = "High"
link = "https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-server-2008-r2-and-2008/cc756372(v=ws.10)"

[[rules]]
id = "display_4101_intel"
source = "eventlog"
channel = "System"
provider_any = ["igdkmdn64", "igdkmd64", "igfx"]
event_id = 4101
weight = 15
verdict = "Intel Arc / Intel graphics driver stopped responding and recovered (TDR)"
confidence = "High"
next_steps = ["Update the Intel graphics driver", "Disable MPO", "Check GPU power and temperatures"]
link = "https://learn.microsoft.com/en-us/troubleshoot/windows-client/performance/display-driver-stops-responding"

# ---------------------------------------------------------------------------
# Memory / commit / pagefile
# ---------------------------------------------------------------------------

[[rules]]
id = "pagefile_2004"
source = "eventlog"
channel = "System"
provider = "Microsoft-Windows-Resource-Exhaustion-Detector"
event_id = 2004
weight = 35
verdict = "Low virtual memory (commit) - check pagefile, not VRAM"
confidence = "High"
next_steps = ["Compare CommitLimit vs Commit in the top bar", "Increase the pagefile or close memory-hungry processes"]
link = "https://learn.microsoft.com/en-us/troubleshoot/windows-server/performance/troubleshoot-application-service-memory-leaks"

[[rules]]
id = "kernel_power_41"
source = "eventlog"
channel = "System"
provider = "Microsoft-Windows-Kernel-Power"
event_id = 41
weight = 10
verdict = "Sudden power loss or hard shutdown before Windows could record a clean crash (Kernel-Power 41)"
confidence = "Medium"
next_steps = ["Check temperatures and PSU under load", "Look for WHEA 17/18/19 and BugCheck 1001 nearby", "Disable automatic restart on BSOD to capture the stop code"]
link = "https://learn.microsoft.com/en-us/troubleshoot/windows-client/performance/event-id-41-restart"

[[rules]]
id = "bugcheck_1001"
source = "eventlog"
channel = "System"
provider_any = ["BugCheck", "Microsoft-Windows-WER-SystemErrorReporting"]
event_id = 1001
weight = 20
verdict = "Blue screen recorded (BugCheck 1001)"
confidence = "High"
link = "https://learn.microsoft.com/en-us/answers/questions/5838090/event-1001-bugcheck"

[[rules]]
id = "application_error_1000"
source = "eventlog"
channel = "Application"
provider = "Application Error"
event_id = 1000
weight = 10
verdict = "Application crash recorded (Event 1000)"
confidence = "Info"
link = "https://learn.microsoft.com/en-us/windows/win32/wer/windows-error-reporting"

# ---------------------------------------------------------------------------
# Anti-cheat drivers - a fault here is not a bug in the game itself.
# ---------------------------------------------------------------------------

[[rules]]
id = "anticheat_wer_loaded_module"
source = "wer"
match_field = "LoadedModule"
match_any = ["EasyAntiCheat_EOS.sys", "EasyAntiCheat.sys", "BEDaisy.sys", "BattlEye"]
weight = 25
verdict = "Anti-cheat driver crash (EasyAntiCheat / BattlEye) - not a game bug"
confidence = "Medium"
next_steps = ["Update or reinstall the game's anti-cheat component", "Remove conflicting overlays and hardware-monitoring hooks", "Verify game files and check the anti-cheat service status"]

[[rules]]
id = "anticheat_wer_faulting_module"
source = "wer"
match_field = "FaultingModule"
match_any = ["EasyAntiCheat_EOS.sys", "EasyAntiCheat.sys", "BEDaisy.sys", "BattlEye"]
weight = 25
verdict = "Anti-cheat driver crash (EasyAntiCheat / BattlEye) - not a game bug"
confidence = "Medium"
next_steps = ["Update or reinstall the game's anti-cheat component", "Remove conflicting overlays and hardware-monitoring hooks", "Verify game files and check the anti-cheat service status"]

[[rules]]
id = "anticheat_game_log"
source = "game_log"
source_any = ["unity_log"]
match_field = "detail"
match_any = ["EasyAntiCheat_EOS.sys", "EasyAntiCheat.sys", "BEDaisy.sys", "BattlEye"]
weight = 25
verdict = "Anti-cheat driver crash (EasyAntiCheat / BattlEye) - not a game bug"
confidence = "Medium"
next_steps = ["Update or reinstall the game's anti-cheat component", "Remove conflicting overlays and hardware-monitoring hooks", "Verify game files and check the anti-cheat service status"]

# ---------------------------------------------------------------------------
# Hardware
# ---------------------------------------------------------------------------

[[rules]]
id = "whea_hardware"
source = "eventlog"
channel = "System"
provider = "Microsoft-Windows-WHEA-Logger"
event_id_any = [17, 18, 19]
weight = 35
verdict = "Hardware / PCIe / CPU cache error (WHEA) — check overclock, undervolt, or RAM stability, not the game"
confidence = "High"
next_steps = ["Check overclock and undervolt", "Run a memory stability test", "Check PCIe power and cables"]
link = "https://learn.microsoft.com/en-us/answers/questions/3844975/whea-logger-event-id-17-a-corrected-hardware-error"

# ---------------------------------------------------------------------------
# Unreal Engine - Shipping-safe fields first, CallStack is optional bonus.
# ---------------------------------------------------------------------------

[[rules]]
id = "ue_oom_flag"
source = "ue_xml"
match_field = "bIsOOM"
match_value = "true"
weight = 35
verdict = "Unreal flagged an out-of-memory condition"
confidence = "High"

[[rules]]
id = "ue_out_of_video_memory"
source = "ue_xml"
match_field = "ErrorMessage"
match_contains = "Out of video memory"
weight = 30
verdict = "UE VRAM allocation failed - often RAM/pagefile exhaustion in disguise"
confidence = "Medium"

[[rules]]
id = "ue_fatal_or_ensure"
source = "ue_xml"
match_field = "CrashType"
match_any = ["Crash", "Ensure", "Assert"]
weight = 8
verdict = "Unreal engine-level malfunction (0xE0000001 / 0xE0000002)"
confidence = "Medium"

# ---------------------------------------------------------------------------
# Unity / generic game log / WER
# ---------------------------------------------------------------------------

[[rules]]
id = "unity_crash"
source = "unity_log"
match_any = ["Crash!!!", "OutOfMemoryException"]
weight = 30
verdict = "Unity player crash marker found in Player.log"
confidence = "High"

[[rules]]
id = "dxgi_device_hung"
source = "game_log"
source_any = ["unity_log"]
match_field = "detail"
match_any = ["DXGI_ERROR_DEVICE_HUNG", "0x887A0006", "DXGI_ERROR_DEVICE_REMOVED", "0x887A0005"]
weight = 20
verdict = "Game lost the D3D device after a driver reset"
confidence = "High"

[[rules]]
id = "d3d12_vulkan_out_of_vram_game_log"
source = "game_log"
source_any = ["unity_log"]
match_field = "detail"
match_any = ["Out of video memory", "VK_ERROR_OUT_OF_DEVICE_MEMORY"]
weight = 30
verdict = "Out of video memory (D3D12/Vulkan) - check VRAM budget, texture streaming and pagefile"
confidence = "High"
next_steps = ["Lower texture quality and disable ray tracing", "Close GPU-heavy overlays", "Check RAM and pagefile headroom"]
link = "https://learn.microsoft.com/en-us/windows/win32/direct3d12/out-of-memory-handling"

[[rules]]
id = "d3d12_vulkan_out_of_vram_ue_xml"
source = "ue_xml"
match_field = "ErrorMessage"
match_any = ["VK_ERROR_OUT_OF_DEVICE_MEMORY"]
weight = 30
verdict = "Out of video memory (D3D12/Vulkan) - check VRAM budget, texture streaming and pagefile"
confidence = "High"
next_steps = ["Lower texture quality and disable ray tracing", "Close GPU-heavy overlays", "Check RAM and pagefile headroom"]
link = "https://learn.microsoft.com/en-us/windows/win32/direct3d12/out-of-memory-handling"

[[rules]]
id = "live_kernel_141"
source = "wer"
match_field = "LiveKernelCode"
match_value = "141"
weight = 25
verdict = "LiveKernelEvent 141 - VIDEO_TDR without a full reboot"
confidence = "High"
link = "https://learn.microsoft.com/en-us/answers/questions/5918013/consistent-livekernelevent-141-errors-causing-game"

[[rules]]
id = "overlay_hook_in_wer"
source = "wer"
match_field = "LoadedModule"
match_any = [
  "RTSSHooks64.dll", "RTSSHooks.dll", "DiscordHook64.dll", "ow-graphics-vulkan.dll",
  "SpecialK64.dll", "dxgi.dll", "d3d12.dll", "d3d11.dll", "nvspcap64.dll"
]
weight = 15
verdict = "Third-party overlay/proxy DLL loaded into the game at crash time"
confidence = "Medium"
note = "Historical evidence from Report.wer. System32/SysWOW64 DXGI/D3D DLLs are ignored."

