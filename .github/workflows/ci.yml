name: CI & Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

      - name: Build release
        run: cargo build --release

  # Decides whether this push should publish a release.
  # main push: only when Cargo.toml version has no release yet.
  # v* tag push: always, so an existing release can be rebuilt/repaired.
  gate:
    needs: check
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.ver.outputs.version }}
      build: ${{ steps.ver.outputs.build }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version and release state
        id: ver
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          if [ -z "$version" ]; then
            echo "::error::Could not read version from Cargo.toml"
            exit 1
          fi
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag_version="${GITHUB_REF_NAME#v}"
            if [ "$tag_version" != "$version" ]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
              exit 1
            fi
          fi
          if gh release view "v$version" >/dev/null 2>&1; then
            if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
              build=true
            else
              build=false
            fi
          else
            build=true
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"

  release:
    needs: gate
    if: needs.gate.outputs.build == 'true'
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.gate.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2

      - name: Build release
        run: cargo build --release

      - name: Prepare archive
        shell: bash
        run: |
          mkdir -p stage
          cp target/release/framefault.exe stage/
          cp LICENSE stage/
          cd stage
          7z a "../framefault-v${VERSION}-win64.zip" ./*

      - name: SHA256
        id: sha
        shell: bash
        run: |
          echo "exe=$(sha256sum target/release/framefault.exe | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "zip=$(sha256sum "framefault-v${VERSION}-win64.zip" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Build release notes
        shell: bash
        run: |
          section=$(mktemp)
          awk -v header="## ${VERSION}" '
            index($0, header) == 1 { found = 1; next }
            found && index($0, "## ") == 1 { exit }
            found { print }
          ' CHANGELOG.md > "$section" 2>/dev/null || true
          {
            echo "One clear verdict for every PC game crash. Read-only diagnostics for Event Log, WER, Unreal/Unity logs and game logs — with an anonymous report you can paste on a forum."
            echo
            if [ -s "$section" ]; then
              echo "**Changes**"
              cat "$section"
              echo
            fi
            echo "**Download**"
            echo "- \`framefault-v${VERSION}-win64.zip\` — portable, includes the MIT license"
            echo "- \`framefault.exe\` — the same binary without the archive"
            echo
            echo "**SHA256**"
            echo "- framefault.exe: \`${{ steps.sha.outputs.exe }}\`"
            echo "- framefault-v${VERSION}-win64.zip: \`${{ steps.sha.outputs.zip }}\`"
          } > release-notes.md

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: FrameFault v${{ env.VERSION }} — Portable Windows Crash Verdict Tool
          body_path: release-notes.md
          overwrite_files: true
          files: |
            target/release/framefault.exe
            framefault-v${{ env.VERSION }}-win64.zip
