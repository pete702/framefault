name: CI & Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

      - name: Build release
        run: cargo build --release

  release:
    needs: check
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2

      - name: Build release
        run: cargo build --release

      - name: Get version
        id: ver
        shell: bash
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Prepare archive
        shell: bash
        run: |
          mkdir -p stage
          cp target/release/framefault.exe stage/
          cp LICENSE stage/
          cd stage
          7z a "../framefault-v${{ steps.ver.outputs.value }}-win64.zip" ./*

      - name: SHA256
        id: sha
        shell: bash
        run: |
          echo "exe=$(sha256sum target/release/framefault.exe | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "zip=$(sha256sum framefault-v${{ steps.ver.outputs.value }}-win64.zip | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          name: FrameFault v${{ steps.ver.outputs.value }} — Portable Windows Crash Verdict Tool
          body: |
            One clear verdict for every PC game crash. Read-only diagnostics for Event Log, WER, Unreal/Unity logs and game logs — with an anonymous report you can paste on a forum.

            **Download**
            - `framefault-v${{ steps.ver.outputs.value }}-win64.zip` — portable, includes the MIT license
            - `framefault.exe` — the same binary without the archive

            **SHA256**
            - framefault.exe: `${{ steps.sha.outputs.exe }}`
            - framefault-v${{ steps.ver.outputs.value }}-win64.zip: `${{ steps.sha.outputs.zip }}`
          files: |
            target/release/framefault.exe
            framefault-v${{ steps.ver.outputs.value }}-win64.zip
